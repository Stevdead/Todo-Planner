<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>2026</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #222222;
  --text: #efefef;
  --selected: #e5b8d3;
  --dim: #555555;
  --line: #3a3a3a;
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  font-size: 16px;
  height: 100%;
  overflow: hidden;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

/* TITLE */
.year-title {
  padding: 12px 16px 8px;
  font-size: 12px;
  color: var(--dim);
  cursor: pointer;
  user-select: none;
  flex-shrink: 0;
}
.year-title span { color: var(--text); font-size: 13px; }

/* MAIN */
.main {
  display: flex;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

/* TREE PANEL */
.tree-panel {
  width: 210px;
  flex-shrink: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 4px 0 60px 16px;
  scrollbar-width: none;
}
.tree-panel::-webkit-scrollbar { display: none; }

/* GOAL PANEL */
.goal-panel {
  flex: 1;
  overflow-y: auto;
  padding: 4px 16px 60px 22px;
  scrollbar-width: none;
  cursor: pointer;
}
.goal-panel::-webkit-scrollbar { display: none; }

/* TREE */
.tree-node { position: relative; }

.node-row {
  display: flex;
  align-items: center;
  padding: 4px 0;
  cursor: pointer;
  user-select: none;
  position: relative;
}

.node-label {
  font-size: 15px;
  color: var(--text);
  white-space: nowrap;
}
.node-label.sel { color: var(--selected); }
.node-label.dim { color: var(--dim); font-size: 14px; }

.children {
  display: none;
  margin-left: 16px;
  position: relative;
}
.children.open { display: block; }

/* Vertical connector */
.children::before {
  content: '';
  position: absolute;
  left: -10px; top: 0; bottom: 10px;
  width: 1px;
  background: var(--line);
}

/* Horizontal connector per child */
.children > .tree-node > .node-row::before {
  content: '';
  position: absolute;
  left: -10px; top: 50%;
  width: 10px; height: 1px;
  background: var(--line);
}

/* GOAL PANEL */
.breadcrumb {
  font-size: 11px;
  color: var(--dim);
  margin-bottom: 16px;
  pointer-events: none;
  letter-spacing: 0.3px;
}

.goal-hint {
  font-size: 13px;
  color: var(--dim);
  margin-bottom: 18px;
  pointer-events: none;
}

.goal-item { margin-bottom: 14px; }

.goal-title-row {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}

.goal-check {
  width: 12px; height: 12px;
  border: 1px solid var(--dim);
  border-radius: 2px;
  flex-shrink: 0;
  position: relative;
  transition: all 0.15s;
  cursor: pointer;
}
.goal-check.done { background: var(--selected); border-color: var(--selected); }
.goal-check.done::after {
  content: '';
  position: absolute;
  left: 2px; top: -1px;
  width: 5px; height: 8px;
  border-right: 1.5px solid #222;
  border-bottom: 1.5px solid #222;
  transform: rotate(45deg);
}

.goal-name { font-size: 15px; color: var(--text); flex: 1; }
.goal-name.done { color: var(--dim); text-decoration: line-through; }

.goal-arrow { font-size: 11px; color: var(--dim); }
.goal-del { font-size: 11px; color: var(--dim); opacity: 0; transition: opacity 0.1s; cursor: pointer; }
.goal-title-row:hover .goal-del { opacity: 0.7; }

.goal-detail {
  display: none;
  margin: 5px 0 0 22px;
}
.goal-detail.open { display: block; }
.goal-detail input {
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--line);
  color: var(--dim);
  font-size: 13px;
  font-family: Arial, sans-serif;
  width: 100%;
  outline: none;
  padding: 3px 0;
}

/* YEAR OVERLAY */
.year-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 100;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  background: rgba(34,34,34,0.8);
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
.year-overlay.open { display: flex; }

/* The year strip — full width, centered vertically */
.year-strip-wrap {
  width: 100%;
  overflow: hidden;
  position: relative;
}

.year-strip {
  display: flex;
  align-items: baseline;
  gap: 40px;
  overflow-x: auto;
  padding: 20px 50vw; /* large padding so items can scroll to center */
  scrollbar-width: none;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
}
.year-strip::-webkit-scrollbar { display: none; }

.year-opt {
  font-size: 22px;
  color: var(--dim);
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.15s, font-size 0.15s;
  scroll-snap-align: center;
  flex-shrink: 0;
}
.year-opt.center-year { color: var(--text); font-size: 36px; }
.year-opt.near-year { color: #888; font-size: 26px; }
.year-opt.active { color: var(--selected); }

.overlay-close { margin-top: 28px; font-size: 11px; color: var(--dim); cursor: pointer; letter-spacing: 1px; }

/* ADD OVERLAY */
.add-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 100;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  background: rgba(34,34,34,0.6);
  align-items: center; justify-content: center;
}
.add-overlay.open { display: flex; }

.add-box {
  background: #2b2b2b;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 22px;
  width: 290px;
  display: flex; flex-direction: column; gap: 12px;
}
.add-lbl { font-size: 11px; color: var(--dim); letter-spacing: 0.5px; }
.add-input {
  background: transparent; border: none;
  border-bottom: 1px solid var(--line);
  color: var(--text); font-size: 15px;
  font-family: Arial, sans-serif;
  outline: none; padding: 4px 0; width: 100%;
}
.add-btns { display: flex; justify-content: flex-end; gap: 16px; margin-top: 4px; }
.add-btns button { background: none; border: none; font-family: Arial, sans-serif; font-size: 13px; cursor: pointer; color: var(--dim); }
.add-btns .ok { color: var(--selected); }

/* LOGIN SCREEN */
.login-screen {
  display: none;
  position: fixed; inset: 0; z-index: 200;
  background: var(--bg);
  align-items: center; justify-content: center;
  flex-direction: column; gap: 16px;
}
.login-screen.show { display: flex; }
.login-title { font-size: 20px; color: var(--text); margin-bottom: 8px; }
.login-sub { font-size: 13px; color: var(--dim); margin-bottom: 16px; }
.login-btn {
  background: none; border: 1px solid var(--line);
  color: var(--text); font-family: Arial, sans-serif;
  font-size: 14px; padding: 12px 28px; border-radius: 8px;
  cursor: pointer; display: flex; align-items: center; gap: 10px;
  transition: border-color 0.15s;
}
.login-btn:hover { border-color: var(--selected); color: var(--selected); }

/* USER INFO */
.user-info {
  display: none;
  font-size: 11px; color: var(--dim);
  cursor: pointer; margin-left: 10px;
}
.user-info.show { display: inline; }

@media (max-width: 480px) {
  .tree-panel { width: 140px; padding-left: 12px; }
  .node-label { font-size: 14px; }
  .node-label.dim { font-size: 13px; }
}
</style>
</head>
<body>
<!-- Login screen -->
<div class="login-screen" id="loginScreen">
  <div class="login-title">Todo-Planner</div>
  <div class="login-sub">Google 계정으로 로그인하면<br>모든 기기에서 동기화돼요</div>
  <button class="login-btn" onclick="loginWithGoogle()">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Google로 로그인
  </button>
</div>

<div class="app" id="mainApp" style="display:none;">
  <div class="year-title">
    <span id="yearDisplay" onclick="selectYear()" style="cursor:pointer;color:var(--text);font-size:13px;"></span>
    <span onclick="openYearOverlay()" style="cursor:pointer;color:var(--dim);font-size:11px;margin-left:8px;">· change</span>
    <span class="user-info" id="userInfo" onclick="logout()"></span>
  </div>
  <div class="main">
    <div class="tree-panel"><div id="treeRoot"></div></div>
    <div class="goal-panel" id="goalPanel" onclick="onGoalPanelClick(event)">
      <div class="breadcrumb" id="breadcrumb"></div>
      <div class="goal-hint" id="goalHint">select a period →</div>
      <div id="goalList"></div>
    </div>
  </div>
</div>

<!-- Year overlay -->
<div class="year-overlay" id="yearOverlay">
  <div class="year-strip-wrap">
    <div class="year-strip" id="yearStrip"></div>
  </div>
  <div class="overlay-close" onclick="closeYearOverlay()">esc</div>
</div>

<!-- Add overlay -->
<div class="add-overlay" id="addOverlay">
  <div class="add-box" onclick="event.stopPropagation()">
    <div class="add-lbl" id="addLbl"></div>
    <input class="add-input" id="addInput" placeholder="goal title..." autocomplete="off"/>
    <div class="add-btns">
      <button onclick="closeAdd()">cancel</button>
      <button class="ok" onclick="confirmAdd()">add</button>
    </div>
  </div>
</div>

<script type="module">
const NOW = new Date();
let year = NOW.getFullYear();
let sel = null;
// expandedM: which month is open; only ONE at a time
// expandedW: which week is open within that month; only ONE at a time
let openMonth = -1;
let openWeek = -1; // week index within the open month

const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DA = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

// ── FIREBASE ────────────────────────────────────────────
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC1ENimZcEdzqUJRfeBeNGFAXQyDJYKzWg",
  authDomain: "todo-planner-aa914.firebaseapp.com",
  projectId: "todo-planner-aa914",
  storageBucket: "todo-planner-aa914.firebasestorage.app",
  messagingSenderId: "884371685964",
  appId: "1:884371685964:web:ea9a9df9119a477bc62ae9"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

let _cache = {};
let _uid = null;

async function loadAll() {
  if (!_uid) return;
  try {
    const snap = await getDoc(doc(db, 'users', _uid));
    _cache = snap.exists() ? (snap.data().goals || {}) : {};
  } catch(e) { console.error('load error', e); _cache = {}; }
}

async function persistAll() {
  if (!_uid) return;
  try { await setDoc(doc(db, 'users', _uid), { goals: _cache }); }
  catch(e) { console.error('save error', e); }
}

function getG(k) { return _cache[k] || []; }
function setG(k, g) { _cache[k] = g; persistAll(); }

async function loginWithGoogle() {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch(e) { alert('로그인 실패: ' + e.message); }
}

function logout() { signOut(auth); }

// Calendar weeks: Sun=start, Sat=end
// Returns array of weeks, each week is array of {d, dn} (only days in this month)
function getCalendarWeeks(y, m) {
  const firstDay = new Date(y, m, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const weeks = [];
  let day = 1 - firstDay; // could be negative (days from prev month we skip)
  while (day <= daysInMonth) {
    const week = [];
    for (let i = 0; i < 7; i++, day++) {
      if (day >= 1 && day <= daysInMonth) {
        week.push({ d: day, dn: DA[i] });
      }
    }
    if (week.length > 0) weeks.push(week);
  }
  return weeks;
}

function getWeekOfDay(y, m, d) {
  const weeks = getCalendarWeeks(y, m);
  for (let i = 0; i < weeks.length; i++) {
    if (weeks[i].some(dd => dd.d === d)) return i;
  }
  return 0;
}

function isToday(m, d) { return year===NOW.getFullYear()&&m===NOW.getMonth()&&d===NOW.getDate(); }

function selectYear() {
  const yk = `Y${year}`;
  sel = { k: yk, label: `${year}` };
  openMonth = -1; openWeek = -1;
  renderGoals();
  renderTree();
}

function renderTree() {
  const root = document.getElementById('treeRoot');
  root.innerHTML = '';

  // Year node at top
  const yk = `Y${year}`;
  const isSelY = sel && sel.k === yk;
  const yNode = document.createElement('div');
  yNode.className = 'tree-node';
  const yRow = document.createElement('div');
  yRow.className = 'node-row';
  yRow.onclick = e => { e.stopPropagation(); selectYear(); };
  yRow.innerHTML = `<span class="node-label${isSelY?' sel':''}">${year}${isSelY?'*':''}</span>`;
  yNode.appendChild(yRow);

  // Month children always shown under year, connected
  const yCh = document.createElement('div');
  yCh.className = 'children open';

  for (let m = 0; m < 12; m++) {
    const mk = `Y${year}M${m}`;
    const isSelM = sel && sel.k === mk;
    const mOpen = openMonth === m;

    const mNode = document.createElement('div');
    mNode.className = 'tree-node';

    const mRow = document.createElement('div');
    mRow.className = 'node-row';
    mRow.onclick = e => { e.stopPropagation(); doSelect({k:mk, label:`${year} · ${MO[m]}`}); clickMonth(m); };
    mRow.innerHTML = `<span class="node-label${isSelM?' sel':''}">${MO[m]}${isSelM?'*':''}</span>`;
    mNode.appendChild(mRow);

    // Only render children if this month is open
    if (mOpen) {
      const mCh = document.createElement('div');
      mCh.className = 'children open';

      const weeks = getCalendarWeeks(year, m);
      weeks.forEach((wDays, wi) => {
        const wk = `Y${year}M${m}W${wi}`;
        const isSelW = sel && sel.k === wk;
        const wOpen = openMonth === m && openWeek === wi;

        const wNode = document.createElement('div');
        wNode.className = 'tree-node';

        const wRow = document.createElement('div');
        wRow.className = 'node-row';
        wRow.onclick = e => { e.stopPropagation(); doSelect({k:wk, label:`${year} · ${MO[m]} · Week ${wi+1}`}); clickWeek(m, wi); };
        wRow.innerHTML = `<span class="node-label${isSelW?' sel':' dim'}">Week ${wi+1}${isSelW?'*':''}</span>`;
        wNode.appendChild(wRow);

        // Only render day children if this week is open
        if (wOpen) {
          const wCh = document.createElement('div');
          wCh.className = 'children open';

          wDays.forEach(({d, dn}) => {
            const dk = `Y${year}M${m}W${wi}D${d}`;
            const isSelD = sel && sel.k === dk;
            const tod = isToday(m, d);

            const dNode = document.createElement('div');
            dNode.className = 'tree-node';
            const dRow = document.createElement('div');
            dRow.className = 'node-row';
            dRow.onclick = e => { e.stopPropagation(); doSelect({k:dk, label:`${year} · ${MO[m]} · Week ${wi+1} · ${d} (${dn})`}); };
            dRow.innerHTML = `<span class="node-label${isSelD?' sel':(tod&&!isSelD?'':' dim')}">${d} (${dn})${isSelD?'*':''}</span>`;
            dNode.appendChild(dRow);
            wCh.appendChild(dNode);
          });

          wNode.appendChild(wCh);
        }

        mCh.appendChild(wNode);
      });

      mNode.appendChild(mCh);
    }

    yCh.appendChild(mNode);
  }

  yNode.appendChild(yCh);
  root.appendChild(yNode);
}

function clickMonth(m) {
  if (openMonth === m) {
    openMonth = -1; openWeek = -1;
  } else {
    openMonth = m; openWeek = -1;
  }
  renderTree();
}

function clickWeek(m, wi) {
  if (openMonth === m && openWeek === wi) {
    openWeek = -1;
  } else {
    openMonth = m; openWeek = wi;
  }
  renderTree();
}

function doSelect(node) {
  sel = node;
  renderGoals();
  renderTree();
}

// ── GOALS ──────────────────────────────────────────────
function renderGoals() {
  const bc = document.getElementById('breadcrumb');
  const list = document.getElementById('goalList');
  const hint = document.getElementById('goalHint');

  if (!sel) { bc.textContent=''; hint.textContent='select a period →'; list.innerHTML=''; return; }

  bc.textContent = sel.label;
  hint.textContent = 'tap to add goal';

  const goals = getG(sel.k);
  list.innerHTML = '';
  goals.forEach((g, i) => {
    const item = document.createElement('div');
    item.className = 'goal-item';
    item.innerHTML = `
      <div class="goal-title-row" onclick="toggleDetail(${i})">
        <div class="goal-check${g.done?' done':''}" onclick="event.stopPropagation();toggleDone(${i})"></div>
        <div class="goal-name${g.done?' done':''}">${esc(g.title)}</div>
        <span class="goal-arrow">${g.open?'▲':'▼'}</span>
        <span class="goal-del" onclick="event.stopPropagation();delGoal(${i})">✕</span>
      </div>
      <div class="goal-detail${g.open?' open':''}">
        <input value="${esc(g.detail||'')}" placeholder="detail..."
          onchange="saveDetail(${i},this.value)" onclick="event.stopPropagation()"/>
      </div>`;
    list.appendChild(item);
  });
}

function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toggleDone(i){ if(!sel)return; const g=getG(sel.k); g[i].done=!g[i].done; setG(sel.k,g); renderGoals(); }
function toggleDetail(i){ if(!sel)return; const g=getG(sel.k); g[i].open=!g[i].open; setG(sel.k,g); renderGoals(); }
function saveDetail(i,v){ if(!sel)return; const g=getG(sel.k); g[i].detail=v; setG(sel.k,g); }
function delGoal(i){ if(!sel)return; const g=getG(sel.k); g.splice(i,1); setG(sel.k,g); renderGoals(); }

function onGoalPanelClick(e) {
  if(!sel) return;
  if(e.target.closest('.goal-item')) return;
  openAdd();
}

function openAdd() {
  if(!sel) return;
  document.getElementById('addLbl').textContent = sel.label;
  document.getElementById('addInput').value = '';
  document.getElementById('addOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('addInput').focus(),100);
}
function closeAdd() { document.getElementById('addOverlay').classList.remove('open'); }
function confirmAdd() {
  const v = document.getElementById('addInput').value.trim();
  if(!v||!sel){ closeAdd(); return; }
  const g=getG(sel.k);
  g.push({title:v,detail:'',done:false,open:false});
  setG(sel.k,g);
  closeAdd();
  renderGoals();
}
document.getElementById('addInput').addEventListener('keydown',e=>{ if(e.key==='Enter')confirmAdd(); if(e.key==='Escape')closeAdd(); });
document.getElementById('addOverlay').addEventListener('click',closeAdd);

// ── YEAR OVERLAY ────────────────────────────────────────
// Scroll-based year picker: items change size based on proximity to center
function openYearOverlay() {
  const strip = document.getElementById('yearStrip');
  strip.innerHTML = '';
  const cur = NOW.getFullYear();
  const startY = cur - 5, endY = cur + 10;
  const years = [];

  for (let y = startY; y <= endY; y++) {
    const el = document.createElement('div');
    el.className = 'year-opt' + (y === year ? ' active' : '');
    el.textContent = y;
    el.dataset.y = y;
    el.onclick = () => {
      year = y;
      document.getElementById('yearDisplay').textContent = y;
      openMonth = -1; openWeek = -1; sel = null;
      renderTree(); renderGoals(); closeYearOverlay();
    };
    strip.appendChild(el);
    years.push(el);
  }

  document.getElementById('yearOverlay').classList.add('open');

  // Update sizes based on scroll position
  function updateSizes() {
    const stripRect = strip.getBoundingClientRect();
    const centerX = stripRect.left + stripRect.width / 2;
    years.forEach(el => {
      const rect = el.getBoundingClientRect();
      const elCenter = rect.left + rect.width / 2;
      const dist = Math.abs(elCenter - centerX);
      el.classList.remove('center-year', 'near-year');
      if (dist < 40) el.classList.add('center-year');
      else if (dist < 100) el.classList.add('near-year');
    });
  }

  strip.addEventListener('scroll', updateSizes);

  // Scroll to selected year
  setTimeout(() => {
    const active = strip.querySelector('.active') || strip.querySelector(`[data-y="${cur}"]`);
    if (active) {
      const stripWidth = strip.offsetWidth;
      const itemOffset = active.offsetLeft + active.offsetWidth / 2;
      strip.scrollLeft = itemOffset - stripWidth / 2;
    }
    updateSizes();
  }, 60);
}

function closeYearOverlay() { document.getElementById('yearOverlay').classList.remove('open'); }
document.getElementById('yearOverlay').addEventListener('click', e => { if(e.target===document.getElementById('yearOverlay')||e.target.classList.contains('year-strip-wrap'))closeYearOverlay(); });

// ── AUTH STATE & INIT ────────────────────────────────────
onAuthStateChanged(auth, async (user) => {
  if (user) {
    _uid = user.uid;
    document.getElementById('loginScreen').classList.remove('show');
    document.getElementById('mainApp').style.display = 'flex';
    const ui = document.getElementById('userInfo');
    ui.textContent = user.displayName || user.email;
    ui.classList.add('show');
    await loadAll();
    document.getElementById('yearDisplay').textContent = year;
    const cm = NOW.getMonth();
    const todayWeekIndex = getWeekOfDay(year, cm, NOW.getDate());
    openMonth = cm;
    openWeek = todayWeekIndex;
    sel = {
      k: `Y${year}M${cm}W${todayWeekIndex}D${NOW.getDate()}`,
      label: `${year} · ${MO[cm]} · Week ${todayWeekIndex+1} · ${NOW.getDate()} (${DA[NOW.getDay()]})`
    };
    renderTree();
    renderGoals();
  } else {
    _uid = null;
    _cache = {};
    document.getElementById('loginScreen').classList.add('show');
    document.getElementById('mainApp').style.display = 'none';
  }
});
</script>
